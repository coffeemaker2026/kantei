name: shinki-kantei

services:
  web:
    build:
      context: .
    ports:
      - "${SHINKI_PORT:-8080}:80"
    volumes:
      # ビルド結果の frontend/dist フォルダごと読み取り専用でマウントし、npm run build でビルドし直したらブラウザの再読み込みで反映される。
      # 単一ファイルのマウントは、ファイルが置き換えられると反映されなくなるため避けている。
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx:/etc/nginx/conf.d:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
