server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    server_tokens off;
    charset utf-8;
    charset_types text/css application/javascript application/json;

    root /usr/share/nginx/html;
    index shinki-kantei.html;

    # 試作中は編集をすぐ反映させたいのでキャッシュさせない
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # フォルダごとマウントしているので、サイト以外のファイルは返さない
    location ~ /\.                                   { return 404; }
    location ~* \.(md|yml|yaml|conf|env)$             { return 404; }
    location ~* (^|/)(Dockerfile|nginx)(/|$)          { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }
}
