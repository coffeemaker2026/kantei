<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>八百万神器鑑定所（試作）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Antique&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E4E6EC; --ink:#1B2340; --muted:#545C78; --gold:#9A7426; --vermilion:#B8372B;
  --field:#FFFFFF; --line:#B9BED0;
  --display:"Zen Antique","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141A2E; --ink:#ECE6D6; --muted:#A3A8BC; --gold:#D4B05A; --vermilion:#D9503F;
    --field:#1E2640; --line:#38426A;
  }
}
:root[data-theme="dark"]{
  --bg:#141A2E; --ink:#ECE6D6; --muted:#A3A8BC; --gold:#D4B05A; --vermilion:#D9503F;
  --field:#1E2640; --line:#38426A;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.7}
main{max-width:1160px;margin:0 auto;padding:28px 20px 48px;display:grid;gap:32px;grid-template-columns:1fr}
@media (min-width:820px){
  main{grid-template-columns:minmax(300px,440px) minmax(0,560px);justify-content:center;column-gap:clamp(32px,5vw,72px);align-items:start;padding-top:56px}
  /* 縦に長いフォーム（写真の調整欄など）をスクロールしてもカードが見え続けるように */
  .card-col{position:sticky;top:calc(env(safe-area-inset-top,0px) + 32px)}
  /* 画面の高さが低いときもカード全体が収まる大きさにする */
  .stage,.meta{max-width:min(440px,calc((100vh - 120px) * 5 / 7))}
}

/* card stage */
.stage{perspective:1400px;width:100%;max-width:360px;margin:0 auto}
.flipper{position:relative;aspect-ratio:5/7;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.flipper.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:4.5%;overflow:hidden;box-shadow:0 18px 40px rgba(10,14,30,.35)}
.back{
  background:
    repeating-radial-gradient(circle at 50% 110%, #1D2750 0 10px, #232E5C 10px 11px, #1D2750 11px 20px),
    #1D2750;
  border:10px solid #D4B05A; display:grid;place-items:center;container-type:inline-size;
}
/* 円は文字の大きさに合わせて描く（文字が円からはみ出さないように） */
.back span{
  width:66cqw;aspect-ratio:1;border:max(2px,.8cqw) solid #D4B05A;border-radius:50%;
  display:grid;place-items:center;padding-top:.2em;
  font-family:var(--display);color:#E9D9A8;font-size:8.5cqw;line-height:1;writing-mode:vertical-rl;letter-spacing:.2em;
}
.front{transform:rotateY(180deg);background:#16203a}
.front img{display:block;width:100%;height:100%}
.front.holo::after{
  content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:color-dodge;opacity:.5;
  background:linear-gradient(115deg,transparent 30%,rgba(255,120,180,.55) 40%,rgba(120,220,255,.55) 50%,rgba(255,240,140,.55) 60%,transparent 70%);
  background-size:250% 250%;animation:holo 4s linear infinite;
}
@keyframes holo{from{background-position:120% 0}to{background-position:-120% 0}}
@media (prefers-reduced-motion:reduce){.flipper{transition:none}.front.holo::after{animation:none}}
.meta{max-width:360px;margin:14px auto 0;display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--muted);min-height:1.7em}

/* panel */
h1{font-family:var(--display);font-weight:400;font-size:clamp(32px,7vw,48px);line-height:1.25;margin:0 0 12px;letter-spacing:.04em}
.lead{margin:0 0 28px;color:var(--muted);max-width:34em}
label{display:block;font-weight:700;font-size:15px;margin:0 0 6px}
.field{margin-bottom:20px}
input[type=text],select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1.5px solid var(--line);border-radius:6px;padding:11px 12px}
input[type=file]{font:inherit;font-size:15px;color:var(--muted);max-width:100%}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
button{font:inherit;font-weight:700;font-size:16px;border-radius:6px;padding:12px 20px;cursor:pointer;border:1.5px solid var(--ink);background:transparent;color:var(--ink)}
button.primary{background:var(--vermilion);border-color:var(--vermilion);color:#fff;font-family:var(--display);font-weight:400;font-size:19px;letter-spacing:.15em;padding:12px 28px}
button[hidden]{display:none}
.editor-wrap[hidden]{display:none}
.editor-wrap{margin:-4px 0 20px}
.modes{display:flex;gap:0;margin-bottom:10px}
.modes button{font-size:14px;padding:8px 14px;border-radius:0;flex:1}
.modes button:first-child{border-radius:6px 0 0 6px}
.modes button:last-child{border-radius:0 6px 6px 0;border-left:none}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
#editor{display:block;width:100%;height:auto;aspect-ratio:638/440;border-radius:6px;background:#222;touch-action:none;cursor:grab}
#editor.lasso{cursor:crosshair}
.zoom{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:14px;color:var(--muted)}
.zoom input{flex:1;accent-color:var(--vermilion)}
.edit-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.edit-row .hint{margin:0}
.samples{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.samples .hint{margin:0;width:100%}
.small{font-size:14px;padding:6px 12px;font-weight:400}
button:disabled{opacity:.45;cursor:not-allowed}
.status{font-size:14px;color:var(--muted);margin-top:12px;min-height:1.7em}
.rules{margin-top:36px;border-top:1px solid var(--line);padding-top:16px;font-size:13px;color:var(--muted)}
.rules p{margin:0 0 6px}
</style>
</head>
<body>
<main>
  <section class="card-col" aria-label="鑑定カード">
    <div class="stage">
      <div class="flipper" id="flipper">
        <div class="face back" aria-hidden="true"><span>神器鑑定所</span></div>
        <div class="face front" id="front"><img id="cardImg" alt=""></div>
      </div>
    </div>
    <div class="meta"><span id="count"></span><span id="rankText"></span></div>
  </section>

  <section>
    <h1>その持ち物、<br>神器かもしれない。</h1>
    <p class="lead">写真と名前を差し出すと、神が格付けしてカードにします。同じ写真なら何度出しても同じ判定です。</p>

    <div class="field">
      <label for="itemName">持ち物の名前</label>
      <input type="text" id="itemName" maxlength="16" placeholder="例：ボールペン" autocomplete="off">
    </div>
    <div class="field">
      <label for="category">種類</label>
      <select id="category">
        <option>文房具</option><option>家電</option><option>台所用品</option>
        <option>衣類・小物</option><option>ガジェット</option><option>食べ物</option><option>その他</option>
      </select>
    </div>
    <div class="field">
      <label for="photo">写真</label>
      <input type="file" id="photo" accept="image/*">
      <div class="samples">
        <span class="hint">写真を選べないときは、見本で試せます：</span>
        <button type="button" class="small" data-sample="mug">マグカップ</button>
        <button type="button" class="small" data-sample="pen">ボールペン</button>
        <button type="button" class="small" data-sample="clock">目覚まし時計</button>
      </div>
      <p class="hint">無地の机や白い紙の上で撮ると、神々しく仕上がります。写真はこの端末の中で使うだけで、どこにも送りません。</p>
    </div>
    <div class="editor-wrap" id="editorWrap" hidden>
      <div class="modes" role="group" aria-label="写真の調整">
        <button type="button" id="modeMove" aria-pressed="true">位置を動かす</button>
        <button type="button" id="modeLasso" aria-pressed="false">なぞって切り抜く</button>
      </div>
      <canvas id="editor" width="638" height="440" aria-label="写真の調整エリア"></canvas>
      <div class="edit-row">
        <p class="hint" id="editHint">ドラッグで位置を調整できます。</p>
        <button type="button" class="small" id="clearLasso" hidden>切り抜きを消す</button>
      </div>
      <label class="zoom" for="zoom">大きさ<input type="range" id="zoom" min="0.5" max="3" step="0.01" value="1"></label>
    </div>

    <div class="actions">
      <button class="primary" id="appraise">鑑定する</button>
      <button id="appeal" hidden>異議を申し立てる</button>
      <button id="save" hidden>画像を保存</button>
    </div>
    <p class="status" id="status" role="status"></p>

    <div class="rules">
      <p>試作版です。判定は写真・名前・種類から決まり、異議を申し立てると再審になります。</p>
      <p>ランクの出やすさ：SSR 3%、SR 10%、R 25%、N 40%、Z 22%</p>
    </div>
  </section>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const W = 750, H = 1050;
  let lastCard = null, lastName = "", photo = null, photoSig = "", appeals = 0, lastKey = "", lastBlob = null, downloads = null;

  /* ---------- deterministic randomness ---------- */
  function hash(str){let h=2166136261>>>0;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
  function rng(seed){let a=seed;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  const pick = (r,arr) => arr[Math.floor(r()*arr.length)];
  const between = (r,lo,hi) => Math.round(lo + r()*(hi-lo));

  /* ---------- word tables (本番ではAIで大量生成する部分) ---------- */
  const RANKS = [["SSR",3],["SR",10],["R",25],["N",40],["Z",22]];
  const CORES = {
    "文房具":["契約の筆","記録の刃","言霊の杖","封印の札"],
    "家電":["雷を飼う箱","風を生む輪","冷気の祠","光の窓"],
    "台所用品":["供物の器","炎の鍋","大地の匙","清めの杓"],
    "衣類・小物":["天の羽衣","守りの鎧","結界の帯","影の外套"],
    "ガジェット":["深淵を映す鏡","千里の耳","知恵の石板","念話の珠"],
    "食べ物":["神饌","禁断の果実","祝福の粒","聖なる供物"],
    "その他":["名もなき宝具","封じられた遺物","迷い神の忘れ物","開かずの宝玉"]
  };
  const EPITHETS = ["伝説の","深淵の","黄昏の","千年の","月曜を拒む","締切を断つ","雷鳴の","終わらない","禁じられた","二度寝を守る","百均生まれの","静寂の"];
  const ATTRS = ["雷","炎","水","風","土","闇","光","無","生活"];
  const GODS = ["雷神","風神","締切の神","二度寝の神","押し入れの神","冷蔵庫の神","コンビニの神","洗濯機の神"];
  const ERAS = ["平成の末","令和のはじめ","とある大掃除の日","去年の年末","神々の飲み会の帰り"];
  const PLACES = ["駅前の交番","押し入れの奥","百均の棚","神界のフリマ","実家の引き出し"];
  const ORIGINS = [
    "{era}、{god}が{place}に落とし物として届け出たもの。",
    "{god}が三百年かけて磨き上げたが、途中で飽きたと伝わる。",
    "{era}、{place}で{god}に拾われ、人間界へ払い下げられた。",
    "持ち主が{era}から毎日使い続けた結果、神性が宿った。"
  ];
  const EFFECTS = ["会議で一度だけ正論を言える","月曜の朝を半刻だけ遅らせる","なくしたリモコンの気配を感じ取れる","自販機の当たりを呼び寄せる（気がする）","締切の神の視線をそらせる","冷蔵庫の残り物を料理に昇華させる"];
  const WEAKS = ["濡れる","褒められる","家族に見つかる","フリマアプリに出品される","説明書を読まれる","Wi-Fiが切れる"];
  const Z_LORE = ["神は特に何も感じなかった。鑑定士は三秒で次の客を呼んだ。","神界では粗大ごみの日に出されている。ただし愛着は認める。","神性はゼロだが、生活感だけは神の領域に達している。"];

  function fill(t,r){return t.replace("{era}",pick(r,ERAS)).replace("{god}",pick(r,GODS)).replace("{place}",pick(r,PLACES));}

  function appraise(seedText, category, salt, name){
    const seed = hash(seedText + "|" + category + "|" + salt);
    const r = rng(seed);
    let roll = r()*100, rank = "Z";
    for (const [k,p] of RANKS){ if (roll < p){ rank = k; break; } roll -= p; }
    const base = {SSR:[86,100],SR:[66,92],R:[45,78],N:[25,60],Z:[1,18]}[rank];
    const isZ = rank === "Z";
    const title = isZ ? "ただの" + name : pick(r,EPITHETS) + pick(r,CORES[category]);
    let lore;
    if (isZ) lore = pick(r,Z_LORE);
    else {
      lore = fill(pick(r,ORIGINS),r) + "手にした者は" + pick(r,EFFECTS) + "。";
      lore += rank === "SSR" ? "神界でも三つしか存在しない。" : "ただし" + pick(r,WEAKS) + "と効力を失う。";
    }
    return {
      rank, title, sub: isZ ? "" : "（※" + name + "）",
      attr: isZ ? "生活" : pick(r,ATTRS), category,
      stats: [
        ["攻撃力", between(r,...base)],
        ["神性", between(r,...base)],
        ["生活感", isZ ? between(r,90,100) : between(r,5,100-base[0]/2)],
        ["くたびれ度", between(r,0,100)]
      ],
      lore, serial: String(seed % 10000000).padStart(7,"0")
    };
  }

  // 写真の特徴（8x8に縮めた明るさ）から署名を作る。同じ写真なら同じ判定になる
  function signature(img){
    const c=document.createElement("canvas"); c.width=8; c.height=8;
    const x=c.getContext("2d"); x.drawImage(img,0,0,8,8);
    const d=x.getImageData(0,0,8,8).data; let s="";
    for(let i=0;i<d.length;i+=4) s+=Math.round((d[i]*.3+d[i+1]*.59+d[i+2]*.11)/32);
    return s;
  }

  /* ---------- photo window: transform, cutout, effects ---------- */
  const PW=638, PH=440;
  const view={zoom:1,offX:0,offY:0};
  let lasso=null; // 写真上の座標で保存（位置を動かしても切り抜きが付いてくる）
  function imgRect(){const s0=Math.max(PW/photo.width,PH/photo.height), s=s0*view.zoom; return {s,x:(PW-photo.width*s)/2+view.offX,y:(PH-photo.height*s)/2+view.offY};}
  function pathOf(ctx,pts,r,move){pts.forEach(([ix,iy],i)=>{const x=r.x+ix*r.s,y=r.y+iy*r.s; (i===0)?ctx.moveTo(x,y):ctx.lineTo(x,y);}); ctx.closePath();}
  function drawPhoto(ctx,r,gray){ if(gray) ctx.filter="grayscale(.85) contrast(.9)"; ctx.drawImage(photo,r.x,r.y,photo.width*r.s,photo.height*r.s); ctx.filter="none"; }
  function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`;}
  function rays(ctx,cx,cy,color,alpha,n){ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=color;for(let i=0;i<n;i++){const a=i*2*Math.PI/n;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,1000,a,a+Math.PI/n);ctx.closePath();ctx.fill();}ctx.restore();}
  function bbox(r){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const[ix,iy]of lasso){const x=r.x+ix*r.s,y=r.y+iy*r.s;x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);}return{cx:(x0+x1)/2,cy:(y0+y1)/2,w:x1-x0,h:y1-y0};}
  const GLOW={SSR:"#FFF2B8",SR:"#F3D27A",R:"#DCE4F2",N:"#E8C9A0",Z:"#BDB5A6"};

  function renderWindow(ctx,rank){
    const r=imgRect(), isZ=rank==="Z", glow=GLOW[rank];
    if (lasso){
      const b=bbox(r);
      const bg=ctx.createRadialGradient(b.cx,b.cy,10,b.cx,b.cy,PW*.8);
      bg.addColorStop(0,isZ?"#8C8576":"#3A4A8A"); bg.addColorStop(1,isZ?"#4F4A42":"#0E1428");
      ctx.fillStyle=bg; ctx.fillRect(0,0,PW,PH);
      rays(ctx,b.cx,b.cy,glow,isZ?.06:.16,isZ?12:24);
      const halo=ctx.createRadialGradient(b.cx,b.cy,0,b.cx,b.cy,Math.max(b.w,b.h)*.85);
      halo.addColorStop(0,hexA(glow,isZ?.15:.6)); halo.addColorStop(1,hexA(glow,0));
      ctx.fillStyle=halo; ctx.fillRect(0,0,PW,PH);
      const c=document.createElement("canvas"); c.width=PW; c.height=PH; const x=c.getContext("2d");
      drawPhoto(x,r,isZ); x.globalCompositeOperation="destination-in"; x.beginPath(); pathOf(x,lasso,r); x.fill();
      ctx.save(); ctx.shadowColor=hexA(glow,isZ?.3:.95); ctx.shadowBlur=isZ?10:40; ctx.drawImage(c,0,0); ctx.restore();
      ctx.drawImage(c,0,0);
    } else {
      drawPhoto(ctx,r,isZ);
      ctx.save(); ctx.globalCompositeOperation="screen"; rays(ctx,PW/2,PH/2,glow,isZ?.04:.10,24); ctx.restore();
      const v=ctx.createRadialGradient(PW/2,PH/2,PH*.22,PW/2,PH/2,PW*.62);
      v.addColorStop(0,"rgba(0,0,0,0)"); v.addColorStop(1,isZ?"rgba(40,36,30,.6)":"rgba(5,8,25,.75)");
      ctx.fillStyle=v; ctx.fillRect(0,0,PW,PH);
      if (rank==="SSR"||rank==="SR"){ctx.save();ctx.globalCompositeOperation="screen";const g=ctx.createRadialGradient(PW/2,PH/2,0,PW/2,PH/2,PW*.5);g.addColorStop(0,hexA(glow,.28));g.addColorStop(1,hexA(glow,0));ctx.fillStyle=g;ctx.fillRect(0,0,PW,PH);ctx.restore();}
    }
  }

  /* ---------- editor ---------- */
  const ed=$("editor"), ex=ed.getContext("2d");
  let mode="move", drawing=null, drag=null;
  function strokePts(pts,closed){ if(pts.length<2) return; const r=imgRect(); ex.save(); ex.lineWidth=4; ex.strokeStyle="#F3D27A"; ex.setLineDash(closed?[]:[10,8]); ex.beginPath(); pts.forEach(([ix,iy],i)=>{const x=r.x+ix*r.s,y=r.y+iy*r.s;i?ex.lineTo(x,y):ex.moveTo(x,y);}); if(closed) ex.closePath(); ex.stroke(); ex.restore(); }
  function drawEditor(){
    ex.fillStyle="#222"; ex.fillRect(0,0,PW,PH); if(!photo) return;
    const r=imgRect(); drawPhoto(ex,r,false);
    if (lasso){ ex.save(); ex.fillStyle="rgba(0,0,0,.6)"; ex.beginPath(); ex.rect(0,0,PW,PH); pathOf(ex,lasso,r); ex.fill("evenodd"); ex.restore(); strokePts(lasso,true); }
    if (drawing) strokePts(drawing,false);
  }
  function syncEditUI(){
    $("modeMove").setAttribute("aria-pressed",mode==="move"); $("modeLasso").setAttribute("aria-pressed",mode==="lasso");
    ed.classList.toggle("lasso",mode==="lasso"); $("clearLasso").hidden=!lasso;
    $("editHint").textContent = mode==="move" ? "ドラッグで位置を調整できます。" : "対象のまわりをぐるっとなぞってください。指を離すと切り抜きます。";
  }
  function pt(e){const b=ed.getBoundingClientRect();return [(e.clientX-b.left)*PW/b.width,(e.clientY-b.top)*PH/b.height];}
  function toImg([x,y]){const r=imgRect();return [(x-r.x)/r.s,(y-r.y)/r.s];}
  ed.addEventListener("pointerdown",e=>{ if(!photo) return; ed.setPointerCapture(e.pointerId); const p=pt(e);
    if(mode==="move") drag={p,ox:view.offX,oy:view.offY}; else drawing=[toImg(p)]; });
  ed.addEventListener("pointermove",e=>{ const p=pt(e);
    if(drag){ view.offX=drag.ox+p[0]-drag.p[0]; view.offY=drag.oy+p[1]-drag.p[1]; drawEditor(); }
    else if(drawing){ const q=toImg(p), l=drawing[drawing.length-1], r=imgRect(); if(Math.hypot((q[0]-l[0])*r.s,(q[1]-l[1])*r.s)>4){ drawing.push(q); drawEditor(); } } });
  const endPtr=()=>{ if(drag){ drag=null; refreshCard(); }
    if(drawing){ if(drawing.length>=8){ lasso=drawing; status("切り抜きました。"); } else status("なぞる線が短すぎます。対象のまわりを一周なぞってください。"); drawing=null; syncEditUI(); drawEditor(); refreshCard(); } };
  ed.addEventListener("pointerup",endPtr); ed.addEventListener("pointercancel",endPtr);
  $("modeMove").addEventListener("click",()=>{mode="move";syncEditUI();});
  $("modeLasso").addEventListener("click",()=>{mode="lasso";syncEditUI();});
  $("clearLasso").addEventListener("click",()=>{lasso=null;syncEditUI();drawEditor();refreshCard();status("切り抜きを消しました。");});
  $("zoom").addEventListener("input",e=>{view.zoom=+e.target.value;drawEditor();});
  $("zoom").addEventListener("change",()=>refreshCard());

  /* ---------- drawing ---------- */
  const FRAMES = {
    SSR:["#E85D75","#F0B84A","#6CC7A0","#5A8FE0","#A66FD8"],
    SR:["#8A6A22","#E6C66A","#9C7A2C","#F3DC8C","#8A6A22"],
    R:["#6F7888","#E3E7EE","#8E96A4","#D5DAE3"],
    N:["#6B4A2F","#B98A5C","#7A5636"],
    Z:["#A89A84","#BFB39E"]
  };
  function rr(ctx,x,y,w,h,rad){ctx.beginPath();ctx.moveTo(x+rad,y);ctx.arcTo(x+w,y,x+w,y+h,rad);ctx.arcTo(x+w,y+h,x,y+h,rad);ctx.arcTo(x,y+h,x,y,rad);ctx.arcTo(x,y,x+w,y,rad);ctx.closePath();}
  function fitFont(ctx,text,family,max,min,width){let s=max;do{ctx.font=`${s}px ${family}`;if(ctx.measureText(text).width<=width)break;s-=2;}while(s>min);return s;}
  function wrap(ctx,text,x,y,width,lh,maxLines){
    let line="",lines=[];
    for (const ch of text){ if (ctx.measureText(line+ch).width > width){ lines.push(line); line=ch; } else line+=ch; }
    if (line) lines.push(line);
    lines.slice(0,maxLines).forEach((l,i)=>ctx.fillText(l,x,y+i*lh));
  }

  function draw(card, name){
    const c = document.createElement("canvas"); c.width=W; c.height=H;
    const ctx = c.getContext("2d");
    const D = '"Zen Antique","Hiragino Mincho ProN",serif', B = '"Zen Kaku Gothic New","Hiragino Sans",sans-serif';
    const isZ = card.rank === "Z";

    // frame
    const g = ctx.createLinearGradient(0,0,W,H);
    FRAMES[card.rank].forEach((col,i,a)=>g.addColorStop(i/(a.length-1),col));
    rr(ctx,0,0,W,H,34); ctx.fillStyle=g; ctx.fill();
    if (card.rank==="SSR"){ const r=rng(hash(card.serial)); ctx.fillStyle="rgba(255,255,255,.8)"; for(let i=0;i<40;i++){const x=r()*W,y=r()*H; if(x>40&&x<W-40&&y>40&&y<H-40)continue; ctx.beginPath();ctx.arc(x,y,r()*3+1,0,7);ctx.fill();} }

    // inner panel
    const panel = isZ ? "#6E685D" : "#16203A";
    rr(ctx,26,26,W-52,H-52,20); ctx.fillStyle=panel; ctx.fill();
    ctx.lineWidth=3; ctx.strokeStyle = isZ ? "#968C7A" : "#D4B05A"; rr(ctx,36,36,W-72,H-72,14); ctx.stroke();

    const textCol = isZ ? "#ECE6DA" : "#F1EAD8", label = isZ ? "#D8CFBF" : "#D9B65C";

    // name
    ctx.fillStyle=textCol; ctx.textBaseline="alphabetic"; ctx.textAlign="left";
    fitFont(ctx,card.title,D,56,30,480); ctx.fillText(card.title,64,118);
    if (card.sub){ ctx.font=`26px ${B}`; ctx.fillStyle=label; ctx.fillText(card.sub,66,158); }

    // rank stamp
    ctx.save(); ctx.translate(W-112,112); ctx.rotate(-0.14);
    ctx.beginPath(); ctx.arc(0,0,62,0,7); ctx.fillStyle = isZ ? "#4F4A42" : "#B8372B"; ctx.fill();
    ctx.lineWidth=4; ctx.strokeStyle="rgba(255,255,255,.75)"; ctx.beginPath(); ctx.arc(0,0,52,0,7); ctx.stroke();
    ctx.fillStyle="#fff"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.font=`${card.rank.length>2?40:card.rank.length>1?48:60}px ${D}`; ctx.fillText(card.rank,0,4);
    ctx.restore(); ctx.textAlign="left"; ctx.textBaseline="alphabetic";

    // photo window
    const px=56,py=184,pw=W-112,ph=440;
    ctx.save(); rr(ctx,px,py,pw,ph,10); ctx.clip(); ctx.translate(px,py);
    renderWindow(ctx,card.rank);
    ctx.restore();
    ctx.lineWidth=3; ctx.strokeStyle=label; rr(ctx,px,py,pw,ph,10); ctx.stroke();

    // type line
    ctx.font=`24px ${B}`; ctx.fillStyle=label;
    ctx.fillText(`属性：${card.attr}　種別：${card.category}`,60,664);

    // stats
    card.stats.forEach(([k,v],i)=>{
      const col=i%2, row=Math.floor(i/2), x=60+col*322, y=708+row*52;
      ctx.font=`22px ${B}`; ctx.fillStyle=textCol; ctx.fillText(k,x,y);
      ctx.fillStyle="rgba(255,255,255,.15)"; rr(ctx,x+128,y-17,118,14,7); ctx.fill();
      ctx.fillStyle=label; rr(ctx,x+128,y-17,Math.max(6,118*v/100),14,7); ctx.fill();
      ctx.font=`700 22px ${B}`; ctx.fillStyle=textCol; ctx.textAlign="right"; ctx.fillText(v,x+296,y); ctx.textAlign="left";
    });

    // lore
    ctx.fillStyle = isZ ? "rgba(0,0,0,.18)" : "rgba(255,255,255,.06)"; rr(ctx,56,790,W-112,170,10); ctx.fill();
    ctx.font=`25px ${B}`; ctx.fillStyle=textCol; wrap(ctx,card.lore,78,834,W-156,38,4);

    // footer
    ctx.font=`20px ${B}`; ctx.fillStyle=label;
    ctx.fillText(`No.${card.serial}`,60,1000);
    ctx.textAlign="right"; ctx.font=`22px ${D}`; ctx.fillText("八百万神器鑑定所",W-60,1000); ctx.textAlign="left";
    return c;
  }

  /* ---------- UI ---------- */
  const status = msg => { $("status").textContent = msg; };

  function usePhoto(img){
    photo = img; photoSig = signature(img); view.zoom=1; view.offX=0; view.offY=0; lasso=null;
    $("zoom").value=1; $("editorWrap").hidden=false; syncEditUI(); drawEditor(); refreshCard();
    status("写真を読み込みました。必要なら位置を調整するか、対象をなぞって切り抜いてください。");
  }
  function loadBlob(blob){
    if (!blob || !/^image\//.test(blob.type)){ status("画像ファイルを選んでください。"); return; }
    const url = URL.createObjectURL(blob), img = new Image();
    img.onload = () => usePhoto(img);
    img.onerror = () => status("この写真は読み込めません。別の画像を選んでください。");
    img.src = url;
  }
  $("photo").addEventListener("change", e => { const f = e.target.files && e.target.files[0]; if (f) loadBlob(f); });
  // 貼り付け・ドラッグ＆ドロップでも受け付ける
  document.addEventListener("paste", e => { const it=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith("image/")); if(it){ e.preventDefault(); loadBlob(it.getAsFile()); } });
  document.addEventListener("dragover", e => e.preventDefault());
  document.addEventListener("drop", e => { e.preventDefault(); const f=e.dataTransfer?.files?.[0]; if(f) loadBlob(f); });

  // 見本の写真（散らかった机の上の持ち物をCanvasで描く）
  function sample(kind){
    const c=document.createElement("canvas"); c.width=800; c.height=600; const x=c.getContext("2d");
    x.fillStyle="#8B6A4A"; x.fillRect(0,0,800,600);
    for(let i=0;i<30;i++){ x.strokeStyle=`rgba(60,40,25,${.15+(i%3)*.08})`; x.lineWidth=2+(i%4); x.beginPath(); x.moveTo(0,i*20+Math.sin(i)*8); x.bezierCurveTo(250,i*20+15,550,i*20-15,800,i*20+Math.cos(i)*8); x.stroke(); }
    x.fillStyle="#E9E4D8"; x.save(); x.translate(110,470); x.rotate(-.3); x.fillRect(-90,-60,180,120); x.restore();
    x.fillStyle="#3F6E4B"; x.beginPath(); x.arc(700,90,55,0,7); x.fill();
    x.fillStyle="rgba(0,0,0,.25)"; x.beginPath(); x.ellipse(410,470,170,40,0,0,7); x.fill();
    if (kind==="mug"){
      x.fillStyle="#C9442F"; x.fillRect(300,200,200,260); x.beginPath(); x.ellipse(400,460,100,24,0,0,Math.PI); x.fill();
      x.lineWidth=28; x.strokeStyle="#C9442F"; x.beginPath(); x.arc(510,320,55,-Math.PI/2,Math.PI/2); x.stroke();
      x.fillStyle="#E8D7B8"; x.beginPath(); x.ellipse(400,200,100,24,0,0,7); x.fill();
      x.fillStyle="#5A2E1C"; x.beginPath(); x.ellipse(400,204,86,18,0,0,7); x.fill();
    } else if (kind==="pen"){
      x.save(); x.translate(400,330); x.rotate(-.5);
      x.fillStyle="#1F3F8F"; x.fillRect(-230,-16,360,32); x.fillStyle="#C9CCD3"; x.fillRect(130,-16,60,32);
      x.beginPath(); x.moveTo(190,-16); x.lineTo(250,0); x.lineTo(190,16); x.fill();
      x.fillStyle="#E0E3EA"; x.fillRect(-200,-26,140,10); x.restore();
    } else {
      x.fillStyle="#2B2B2E"; [[315,175],[485,175]].forEach(([a,b])=>{x.beginPath();x.arc(a,b,45,0,7);x.fill();});
      x.fillStyle="#D9A93A"; x.beginPath(); x.arc(400,320,150,0,7); x.fill();
      x.fillStyle="#FBF6EA"; x.beginPath(); x.arc(400,320,122,0,7); x.fill();
      x.strokeStyle="#2B2B2E"; x.lineWidth=10; x.lineCap="round"; x.beginPath(); x.moveTo(400,320); x.lineTo(400,225); x.moveTo(400,320); x.lineTo(470,350); x.stroke();
    }
    const img=new Image(); img.onload=()=>usePhoto(img); img.src=c.toDataURL("image/png");
    const meta={mug:["マグカップ","台所用品"],pen:["ボールペン","文房具"],clock:["目覚まし時計","家電"]}[kind];
    $("itemName").value=meta[0]; $("category").value=meta[1];
  }
  document.querySelectorAll("[data-sample]").forEach(b=>b.addEventListener("click",()=>sample(b.dataset.sample)));

  async function run(isAppeal){
    if (!photo){ status("鑑定には写真が必要です。持ち物の写真を選んでください。"); $("photo").focus(); return; }
    const name = $("itemName").value.trim();
    if (!name){ status("持ち物の名前を入れてください。"); $("itemName").focus(); return; }
    const cat = $("category").value, key = name+"|"+cat+"|"+photoSig;
    if (!isAppeal || key !== lastKey) appeals = 0;
    if (isAppeal) appeals++;
    lastKey = key;
    try { await Promise.all([document.fonts.load('40px "Zen Antique"'),document.fonts.load('24px "Zen Kaku Gothic New"'),document.fonts.load('700 24px "Zen Kaku Gothic New"')]); } catch(_) {}
    const card = appraise(name + "|" + photoSig, cat, appeals, name);
    lastCard = card; lastName = name;
    const canvas = draw(card, name);
    const flipper = $("flipper");
    const show = () => {
      $("cardImg").src = canvas.toDataURL("image/png");
      $("cardImg").alt = `${card.rank}ランク：${card.title}${card.sub}。${card.lore}`;
      $("front").classList.toggle("holo", card.rank==="SSR" || card.rank==="SR");
      flipper.classList.add("flipped");
    };
    if (flipper.classList.contains("flipped") && !matchMedia("(prefers-reduced-motion: reduce)").matches){
      flipper.classList.remove("flipped"); setTimeout(show, 650);
    } else show();
    canvas.toBlob(b => { lastBlob = b; }, "image/png");
    $("count").textContent = appeals ? `再審 ${appeals} 回目` : "第一審";
    $("rankText").textContent = `判定：${card.rank}`;
    $("appeal").hidden = false;
    $("save").hidden = !downloads;
    status(downloads ? "" : "画像を長押しすると保存できます。");
  }

  function refreshCard(){
    if (!lastCard || !photo) return;
    const canvas = draw(lastCard, lastName);
    $("cardImg").src = canvas.toDataURL("image/png");
    canvas.toBlob(b => { lastBlob = b; }, "image/png");
  }

  $("appraise").addEventListener("click", () => run(false));
  $("appeal").addEventListener("click", () => run(true));
  $("itemName").addEventListener("keydown", e => { if (e.key==="Enter") run(false); });

  $("save").addEventListener("click", async () => {
    if (!downloads || !lastBlob) return;
    try { await downloads.save({ filename: "shinki-card.png", data: lastBlob }); status("保存しました。"); }
    catch (err) {
      const code = err && err.code;
      if (code === "declined") status("保存を取りやめました。");
      else if (code === "rate_limited") status("保存の確認が開いています。少し待ってからもう一度押してください。");
      else { downloads = null; $("save").hidden = true; status("ここでは保存できません。画像を長押しして保存してください。"); }
    }
  });

  if (window.claude && typeof window.claude.use === "function"){
    window.claude.use("downloads").then(d => { downloads = d; if (d && lastKey){ $("save").hidden = false; status(""); } }).catch(() => {});
  }
})();
</script>
</body>
